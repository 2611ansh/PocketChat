<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketChat">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.svg">
<title>PocketChat</title>
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#1b1f1d;--mute:#6b736f;--line:#dde1dc;--me:#1f7a55;--meink:#fff;--bot:#e9ece7;--code:#1b1f1d}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--panel:#1c2024;--ink:#e8ece9;--mute:#8b948f;--line:#2a2f34;--me:#7dd3a8;--meink:#0d1f17;--bot:#242a2f;--code:#0d1013}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
#side{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.ib{background:none;border:0;font-size:22px;padding:6px 10px;cursor:pointer;color:var(--ink)}
#msgs{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.m{max-width:min(720px,88%);padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:6px}
.a{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
.a pre{background:var(--code);color:#e8ece9;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;white-space:pre}
.a code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}.a :not(pre)>code{background:var(--line);padding:1px 5px;border-radius:5px}
.err{color:#c0392b}
#empty{margin:auto;text-align:center;color:var(--mute);padding:20px}
form{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:10px 14px;outline:none}
#clip{padding:6px 2px;align-self:center}#send{background:var(--me);color:var(--meink);border:0;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
#new{margin:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
#list{flex:1;overflow-y:auto}
.c{display:flex;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.c.on{background:var(--bg)}.c span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c button{background:none;border:0;color:var(--mute);font-size:16px}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9}
#login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:center}
#login button{padding:10px 24px;border-radius:10px;border:0;background:var(--me);color:var(--meink)}
#tray{display:none;padding:8px 12px 0;background:var(--panel);border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
#tray.on{display:flex}.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:13px;max-width:200px}
.chip img,.m img{height:38px;width:38px;object-fit:cover;border-radius:8px}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{background:none;border:0;color:var(--mute)}
.note{width:100%;font-size:13px;color:var(--mute)}.warn{width:100%;font-size:13px;color:#c0392b}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.m .chips img{height:90px;width:auto;max-width:100%}.dc{font-size:13px;opacity:.85}
.cb{margin:8px 0;border-radius:10px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px;color:#9aa5a0;background:#ffffff14}
.cp{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
.ch .cp{color:#e8ece9;border-color:#ffffff33}.a .cb pre{margin:0;border-radius:0}.mact{margin-top:8px}
.u .cp{color:inherit;border-color:currentColor;opacity:.75}.m.editing{width:min(720px,88%)}
.ed{width:100%;font-size:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;resize:vertical;min-height:70px;outline:none}
.u .mact{display:flex;gap:8px}
#pm{font-size:20px;border-radius:10px}#pm.on{background:var(--bot);outline:2px solid var(--me)}
.a .mact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.fl{font-size:12px;opacity:.8;margin-top:6px}.fl summary{cursor:pointer}
#scrim{display:none}
@media(max-width:700px){
 #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px #0006}
 body.open #side{transform:none}body.open #scrim{display:block;position:fixed;inset:0;z-index:4}
}
@media(min-width:701px){#menu{display:none}}
</style></head><body>
<div id="login"><h2>PocketChat</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="go">Unlock</button></div>
<aside id="side"><button id="new">+ New chat</button><div id="list"></div></aside><div id="scrim"></div>
<div id="main">
 <header><button class="ib" id="menu" aria-label="Chats">☰</button><select id="model" aria-label="Model"></select><button class="ib" id="pm" type="button" title="Project mode: build whole projects and download as .zip" aria-label="Project mode">🗂</button></header>
 <div id="msgs"></div>
 <div id="tray"></div>
 <form id="f"><button type="button" class="ib" id="clip" aria-label="Attach">📎</button><input id="file" type="file" multiple hidden><textarea id="t" rows="1" placeholder="Message"></textarea><button id="send" type="submit" aria-label="Send">↑</button></form>
</div>
<script>
const $=s=>document.querySelector(s);
let chats=JSON.parse(localStorage.pc_chats||"[]"),cur=null,busy=null;
let models=[],pending=[];
function save(){try{localStorage.pc_chats=JSON.stringify(chats)}catch{
 for(const c of chats)for(const m of c.msgs)if(m.att)m.att=m.att.map(a=>a.type==="image"?{type:"image",name:a.name,data:null}:a);
 try{localStorage.pc_chats=JSON.stringify(chats)}catch{}}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function codeBlock(p){
 const m=p.match(/^([\w+-]*)\n/),lang=m?m[1]:"";
 return`<div class="cb"><div class="ch"><span>${lang}</span><button type="button" class="cp" data-k="code">Copy code</button></div><pre><code>${p.replace(/^[\w+-]*\n/,"")}</code></pre></div>`;
}
function md(s){
 const parts=esc(s).split(/```/);
 return parts.map((p,i)=>i%2?codeBlock(p):
  p.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/^#{1,4} (.+)$/gm,"<b>$1</b>")).join("");
}
function render(){
 const box=$("#msgs");box.innerHTML="";
 const c=chats.find(x=>x.id===cur);
 if(!c||!c.msgs.length){box.innerHTML='<div id="empty">Ask anything.<br>Free models, running through your own OpenRouter key.</div>';}
 else c.msgs.forEach((m,i)=>{const d=document.createElement("div");d.className="m "+(m.role==="user"?"u":"a")+(m.err?" err":"");
  d.innerHTML=m.role==="user"?attHtml(m)+esc(m.content)+`<div class="mact"><button type="button" class="cp" data-k="edit" data-i="${i}">Edit</button></div>`:md(m.content)+(m.content&&!m.err?`<div class="mact"><button type="button" class="cp" data-k="all" data-i="${i}">Copy response</button>${zipBtn(c,i)}</div>${fileList(c,i)}`:"")+(m.cut?`<div class="fl">⚠ The model hit its length limit, so the last file may be missing or incomplete. Send “continue” for the rest.</div>`:"");box.appendChild(d)});
 box.scrollTop=box.scrollHeight;
 $("#list").innerHTML="";
 chats.forEach(x=>{const r=document.createElement("div");r.className="c"+(x.id===cur?" on":"");
  r.innerHTML="<span>"+esc(x.title)+"</span><button aria-label='Delete'>✕</button>";
  r.onclick=()=>{cur=x.id;if(x.model)$("#model").value=x.model;document.body.classList.remove("open");render()};
  r.querySelector("button").onclick=e=>{e.stopPropagation();chats=chats.filter(y=>y!==x);if(cur===x.id)cur=null;save();render()};
  $("#list").appendChild(r)});
}
async function loadModels(){
 const sel=$("#model");
 try{const r=await fetch("/api/models");if(r.status===401)return showLogin();
  const ms=models=(await r.json()).sort((a,b)=>a.name.localeCompare(b.name));
  sel.innerHTML=ms.map(m=>`<option value="${m.id}">${m.vision?"👁 ":""}${esc(m.name)}</option>`).join("");
  const last=localStorage.pc_model;if(last&&ms.some(m=>m.id===last))sel.value=last;
 }catch{sel.innerHTML="<option>Could not load models</option>"}
}
$("#model").onchange=e=>{localStorage.pc_model=e.target.value;renderTray()};
function showLogin(){$("#login").style.display="flex"}
$("#go").onclick=async()=>{const r=await fetch("/api/login",{method:"POST",body:JSON.stringify({pin:$("#pin").value})});
 if(r.ok){$("#login").style.display="none";loadModels()}else{$("#pin").value="";$("#pin").placeholder="Wrong PIN"}};
$("#new").onclick=()=>{cur=null;document.body.classList.remove("open");render();$("#t").focus()};
$("#menu").onclick=()=>document.body.classList.add("open");
$("#scrim").onclick=()=>document.body.classList.remove("open");
const CAP=60000,loaded={};
function lib(u){return loaded[u]||(loaded[u]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("Could not load the reader library (needs internet)"));document.head.appendChild(s)}))}
function attHtml(m){
 if(!m.att||!m.att.length)return"";
 return'<div class="chips">'+m.att.map(a=>a.type==="image"?(a.data?`<img src="${a.data}" alt="">`:`<span class="dc">🖼 ${esc(a.name)}</span>`):`<span class="dc">${a.type==="project"?"📦":"📄"} ${esc(a.name)}${a.type==="project"&&a.files.length>1?" ("+a.files.length+" files)":""}</span>`).join("")+"</div>";
}
function toApi(m,vis,skipProj){
 if(m.role!=="user"||!m.att||!m.att.length)return{role:m.role,content:m.content};
 let pre="";
 if(!skipProj)for(const a of m.att.filter(a=>a.type==="project"))pre+=projText(a);
 for(const a of m.att.filter(a=>a.type==="doc"))pre+=`[Attached file: ${a.name}]\n${a.text}\n[End of file]\n\n`;
 const imgs=m.att.filter(a=>a.type==="image");
 const note=a=>`[Attached image "${a.name}", as described by a vision model: ${a.desc||"description unavailable"}]\n\n`;
 if(!vis||!imgs.some(a=>a.data)){for(const a of imgs)pre+=note(a);return{role:"user",content:pre+m.content}}
 const parts=[{type:"text",text:pre+(m.content||"Describe the attached image.")}];
 for(const a of imgs){if(a.data)parts.push({type:"image_url",image_url:{url:a.data}});else parts[0].text=note(a)+parts[0].text}
 return{role:"user",content:parts};
}
async function describe(a,focus,signal){
 const pref=/gemma|qwen.*vl|vision|pixtral|mistral-small|llama-4|gemini/i;
 const vs=models.filter(m=>m.vision).sort((x,y)=>pref.test(y.id)-pref.test(x.id)).slice(0,5);
 if(!vs.length)throw new Error("No free vision model is available on your OpenRouter account.");
 const prompt="Describe this image thoroughly so someone who cannot see it can answer questions about it. Transcribe all visible text exactly. Include objects, people, layout, colors, and any chart or table values."+(focus?" The user's question about it: "+focus:"");
 for(const m of vs){
  try{
   const r=await fetch("/api/chat",{method:"POST",signal,headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:m.id,stream:false,messages:[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:a.data}}]}]})});
   if(!r.ok)continue;
   const j=await r.json(),d=j.choices?.[0]?.message?.content;
   if(d&&d.trim())return d.trim().slice(0,6000);
  }catch(x){if(x.name==="AbortError")throw x}
 }
 throw new Error("No free vision model responded just now. Try again in a moment, or pick a 👁 model.");
}
function renderTray(){
 const tr=$("#tray");tr.innerHTML="";tr.classList.toggle("on",pending.length>0);
 pending.forEach((a,i)=>{const d=document.createElement("div");d.className="chip";
  d.innerHTML=(a.type==="image"?`<img src="${a.data}" alt="">`:(a.type==="project"?"📦":"📄"))+`<span>${esc(a.name)}</span><button aria-label="Remove">✕</button>`;
  d.querySelector("button").onclick=()=>{pending.splice(i,1);renderTray()};tr.appendChild(d)});
 const vis=!!models.find(x=>x.id===$("#model").value)?.vision;
 if(pending.some(a=>a.type==="image")&&!vis){const w=document.createElement("div");w.className="note";w.textContent="This model can't see images, so a free vision model will read them first and pass on a description.";tr.appendChild(w)}
}
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.8))};
 im.onerror=()=>no(new Error("Could not read image "+f.name));im.src=u})}
async function readDoc(f){
 const ext=f.name.split(".").pop().toLowerCase();let out="";
 if(ext==="pdf"){
  await lib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let i=1;i<=pdf.numPages&&out.length<CAP;i++){const tc=await(await pdf.getPage(i)).getTextContent();out+=tc.items.map(x=>x.str).join(" ")+"\n\n"}
  if(!out.trim())throw new Error(f.name+" has no readable text (scanned?). Upload its pages as images instead.");
 }else if(ext==="docx"){
  await lib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
  out=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
 }else out=await f.text();
 if(out.length>CAP)out=out.slice(0,CAP)+"\n[Truncated]";
 return out;
}
$("#clip").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
 for(const f of e.target.files){
  try{
   if(f.type.startsWith("image/"))pending.push({type:"image",name:f.name,data:await shrink(f)});
   else if(/\.zip$/i.test(f.name))pending.push(await readZip(f));
   else if(/\.(pdf|docx)$/i.test(f.name))pending.push({type:"doc",name:f.name,text:await readDoc(f)});
   else pending.push(await readTextFile(f));
  }catch(x){alert(x.message)}
  renderTray();
 }
 e.target.value="";
};
/*PROJ*/
const SYS=`You are an expert software engineer. When asked to build or change a project, output EVERY file in full (never snippets, never "rest unchanged"). Format each file exactly like this: a line "### File: relative/path/to/file.ext" followed immediately by a fenced code block with the complete file contents. Use relative paths with forward slashes. Include config and dependency files (package.json, requirements.txt, README.md, .gitignore, etc.). Start with a short plan and the folder tree (in a plain code block, without a File header), then the files, then brief run instructions. If the project is too big for one reply, deliver the most important files first and end with "Say continue for the remaining files." When modifying an existing project, output only the changed files, in full, with the same paths.`;
function okPath(x){return x.length<160&&/^[\w@.+\-\/]+$/.test(x)&&!x.startsWith("/")&&!x.includes("..")&&(/\.[A-Za-z0-9]+$/.test(x)||/(^|\/)(Dockerfile|Makefile|Procfile|LICENSE)$/.test(x))}
function pathFrom(line){
 const x=line.trim().replace(/^(?:#{1,6}\s*|>\s*|[-*]\s+|\d+[.)]\s+)+/,"").replace(/^[*`]*(?:file(?:name)?|path)[*`]*\s*[:\-]\s*/i,"").replace(/[*`]/g,"").replace(/\s*\(.*\)\s*$/,"").replace(/[:\s]+$/,"").trim();
 return okPath(x)?x:null;
}
function parseFiles(txt){
 const out=[],L=txt.split("\n");let hdr=null,hdrR=null;
 for(let i=0;i<L.length;i++){
  const f=L[i].match(/^\s{0,3}(`{3,})(.*)$/);
  if(!f){if(L[i].trim()){const rm=L[i].match(/\[\s*lines?\s+(\d+)\s*[-–]\s*(\d+)[^\]]*\]/i);hdrR=rm?[+rm[1],+rm[2]]:null;hdr=pathFrom(rm?L[i].replace(rm[0],""):L[i])}continue}
  const fence=f[1],info=f[2],code=[];let j=i+1,depth=0,closed=false;
  for(;j<L.length;j++){
   const l=L[j];
   if(fence.length>3){if(new RegExp("^\\s{0,3}`{"+fence.length+",}\\s*$").test(l)){closed=true;break}}
   else if(/^\s{0,3}`{3,}\s*$/.test(l)){if(depth>0)depth--;else{closed=true;break}}
   else if(/^\s{0,3}`{3,}\S/.test(l))depth++;
   code.push(l);
  }
  if(!closed)break;
  let path=hdr;
  if(!path)for(const tok of info.split(/[\s:="']+/))if(/[.\/]/.test(tok)&&okPath(tok)){path=tok;break}
  if(!path&&code.length){const m=code[0].match(/^\s*(?:\/\/|#|--|<!--|\/\*)\s*(?:file(?:name)?:\s*)?([\w@.+\-\/]+)\s*(?:-->|\*\/)?\s*$/i);if(m&&m[1].includes(".")&&okPath(m[1]))path=m[1]}
  if(path)out.push({path:path.replace(/^\.\//,""),content:code.join("\n")+"\n",range:path===hdr?hdrR:null});
  hdr=null;hdrR=null;i=j;
 }
 return out;
}
function splitLines(t){const l=t.split("\n"),nl=l[l.length-1]==="";if(nl)l.pop();return{l,nl}}
function canon(p,map){
 const cands=[p],m=p.match(/^(.*\.[A-Za-z0-9]+)\.(txt|md|text)$/i);if(m)cands.push(m[1]);
 for(const x of cands){if(map.has(x))return x;const b=x.split("/").pop(),hit=[...map.keys()].filter(k=>k.split("/").pop()===b);if(hit.length===1)return hit[0]}
 return p;
}
function projectFiles(c,upto,changedOnly){
 const map=new Map(),changed=new Set();
 for(let i=0;i<=upto;i++){
  const m=c.msgs[i];
  if(m.role==="user"){for(const a of m.att||[])if(a.type==="project")for(const f of a.files)map.set(f.path,f.content)}
  else if(m.role==="assistant"&&!m.err){
   const rng=new Map();
   for(const f of parseFiles(m.content)){
    const p=canon(f.path,map);
    if(f.range){if(!rng.has(p))rng.set(p,[]);rng.get(p).push(f)}else{map.set(p,f.content);changed.add(p)}
   }
   for(const[p,list]of rng){
    const{l,nl}=splitLines(map.get(p)||"");
    for(const f of list.sort((a,b)=>b.range[0]-a.range[0])){
     const[a,b]=f.range;if(a<1||b<a||a>l.length+1)continue;
     l.splice(a-1,b-a+1,...splitLines(f.content).l);
    }
    map.set(p,l.join("\n")+(nl?"\n":""));changed.add(p);
   }
  }
 }
 return[...map].filter(([p])=>!changedOnly||changed.has(p)).map(([path,content])=>({path,content}));
}
const SYS_PART=`You are an expert software engineer working on an existing project that is too large to send at once, so it is processed in parts. Other parts are handled separately, so only deal with the files shown in this part. For each file in this part that must change, output the complete updated file as: a line "### File: relative/path" followed by a fenced code block, keeping the exact same path and file extension. If a file is shown with a line range like [lines A-B of N], output ONLY the replacement for exactly that range, using the header "### File: path [lines A-B]". Do not output files that need no changes. If nothing in this part needs to change, reply exactly: No changes needed in this part. If the request is a question or review rather than a change, answer briefly for the files in this part only.`;
function fenceFor(s){let n=3;while(s.includes("`".repeat(n)))n++;return"`".repeat(n)}
function buildParts(files,limit){
 const items=[];
 for(const f of files){
  if(f.content.length<=limit){items.push({path:f.path,text:f.content,range:null});continue}
  const{l}=splitLines(f.content),n=l.length,cap=Math.floor(limit*0.8);
  const seg=(a,b)=>({path:f.path,text:l.slice(a,b).join("\n")+"\n",range:[a+1,b,n]});
  let a=0,sz=0;
  for(let i=0;i<n;i++){if(sz+l[i].length+1>cap&&i>a){items.push(seg(a,i));a=i;sz=0}sz+=l[i].length+1}
  items.push(seg(a,n));
 }
 const parts=[];let cur=[],sz=0;
 for(const it of items){if(cur.length&&sz+it.text.length>limit){parts.push(cur);cur=[];sz=0}cur.push(it);sz+=it.text.length}
 if(cur.length)parts.push(cur);
 return parts;
}
function partText(items){
 return items.map(it=>{const q=fenceFor(it.text);return`### File: ${it.path}${it.range?` [lines ${it.range[0]}-${it.range[1]} of ${it.range[2]}]`:""}\n${q}\n${it.text}${q}\n\n`}).join("");
}
async function readTextFile(f){
 const b=new Uint8Array(await f.arrayBuffer());
 if(b.subarray(0,8000).includes(0))throw new Error(f.name+" looks like a binary file, so it can't be read as text.");
 if(b.length>1000000)throw new Error(f.name+" is too large (over 1 MB).");
 return{type:"project",name:f.name,files:[{path:f.name,content:new TextDecoder().decode(b)}],omitted:[],ignored:0};
}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return ~c>>>0}
function makeZip(files){
 const enc=new TextEncoder(),parts=[],cd=[],d=new Date();let off=0;
 const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){
  const name=enc.encode(f.path),data=enc.encode(f.content),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
  h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
  c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  cd.push(c.buffer,name);off+=30+name.length+data.length;
 }
 const size=cd.reduce((n,b)=>n+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e.buffer],{type:"application/zip"});
}

const PCAP=1000000;
const IGN=/(^|\/)(node_modules|\.git|\.svn|__pycache__|venv|\.venv|dist|build|\.next|\.idea|\.vscode|target|coverage|__MACOSX)(\/|$)|(^|\/)\.DS_Store$|(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Cargo\.lock|composer\.lock)$/;
const BIN=/\.(png|jpe?g|gif|webp|ico|bmp|tiff?|heic|pdf|zip|gz|tgz|tar|7z|rar|mp[34]|mov|avi|wav|woff2?|ttf|otf|eot|so|dll|dylib|exe|class|jar|pyc|o|a|bin|dat|sqlite3?|db)$/i;
async function inflate(u8){
 if(typeof DecompressionStream==="undefined")throw new Error("This browser can't unzip compressed files. Update iOS/Safari (16.4+).");
 const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
 w.write(u8).catch(()=>{});w.close().catch(()=>{});
 return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function readZip(f){
 const buf=new Uint8Array(await f.arrayBuffer()),dv=new DataView(buf.buffer);
 let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw new Error(f.name+" is not a valid zip file.");
 const n=dv.getUint16(e+10,true),dec=new TextDecoder();let p=dv.getUint32(e+16,true);
 const ent=[];let ignored=0;
 for(let k=0;k<n&&dv.getUint32(p,true)===0x02014b50;k++){
  const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=dec.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
  if(name.endsWith("/"))continue;
  if(IGN.test(name)){ignored++;continue}
  ent.push({name,method,csize,usize,off});
 }
 if(!ent.length)throw new Error("No usable files found in "+f.name);
 const roots=new Set(ent.map(x=>x.name.split("/")[0]));
 const strip=roots.size===1&&ent.every(x=>x.name.includes("/"));
 const got=[],omitted=[];
 for(const x of ent){
  const path=strip?x.name.slice(x.name.indexOf("/")+1):x.name;
  if(BIN.test(path)||x.usize>1000000||(x.method!==0&&x.method!==8)||x.usize===0xFFFFFFFF){omitted.push(path);continue}
  const st=x.off+30+dv.getUint16(x.off+26,true)+dv.getUint16(x.off+28,true),raw=buf.subarray(st,st+x.csize);
  const bytes=x.method===0?raw:await inflate(raw);
  if(bytes.subarray(0,8000).includes(0)){omitted.push(path);continue}
  got.push({path,content:dec.decode(bytes)});
 }
 got.sort((a,b)=>a.content.length-b.content.length);
 let tot=0;const files=[];
 for(const g of got){if(tot+g.content.length<=PCAP){files.push(g);tot+=g.content.length}else omitted.push(g.path)}
 if(!files.length)throw new Error("No readable text files found in "+f.name);
 files.sort((a,b)=>a.path<b.path?-1:1);
 return{type:"project",name:f.name,files,omitted:omitted.slice(0,200),ignored};
}
function projText(a){
 const fence=s=>{let n=3;while(s.includes("`".repeat(n)))n++;return"`".repeat(n)};
 let t=a.files.length===1&&!/\.zip$/i.test(a.name)?`[Uploaded file "${a.name}".`:`[Uploaded project "${a.name}": ${a.files.length} text files included.`;
 if(a.omitted.length)t+=` Left out (binary, too large, or over the size limit): ${a.omitted.slice(0,60).join(", ")}${a.omitted.length>60?", ...":""}.`;
 if(a.ignored)t+=` ${a.ignored} files in ignored folders (node_modules, .git, build output, lock files) were skipped.`;
 t+="]\n\n";
 for(const f of a.files){const q=fence(f.content);t+=`### File: ${f.path}\n${q}\n${f.content}${f.content.endsWith("\n")?"":"\n"}${q}\n\n`}
 return t+"[End of uploaded project]\n\n";
}
/*ENDPROJ*/
let pm=localStorage.pc_pm==="1";
function setPM(){$("#pm").classList.toggle("on",pm);$("#t").placeholder=pm?"Describe the project to build":"Message"}
function zipBtn(c,i){if(!parseFiles(c.msgs[i].content).length)return"";const n=projectFiles(c,i,true).length;return`<button type="button" class="cp" data-k="zip" data-i="${i}">⬇ ${n>1?"Download .zip":"Download file"} (${n} file${n>1?"s":""})</button>`}
function fileList(c,i){const f=[...new Set(parseFiles(c.msgs[i].content).map(x=>x.path))];return f.length?`<details class="fl"><summary>${f.length} file${f.length>1?"s":""} in this reply</summary>${f.map(esc).join("<br>")}</details>`:""}
function downloadZip(c,i){
 const slug=(c.title||"project").replace(/\.zip$/i,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"project";
 const files=projectFiles(c,i,true),upload=c.msgs.some(m=>(m.att||[]).some(a=>a.type==="project"));
 let blob,name;
 if(files.length===1){blob=new Blob([files[0].content],{type:"text/plain"});name=files[0].path.split("/").pop()}
 else{blob=makeZip(files.map(f=>({path:upload?f.path:slug+"/"+f.path,content:f.content})));name=slug+(upload?"-changes":"")+".zip"}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),20000);
}
$("#pm").onclick=()=>{pm=!pm;localStorage.pc_pm=pm?"1":"0";setPM()};
async function copyText(t){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch{}
 const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
 document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
 let ok=false;try{ok=document.execCommand("copy")}catch{}
 ta.remove();return ok;
}
$("#msgs").addEventListener("click",async e=>{
 const b=e.target.closest(".cp");if(!b)return;
 const k=b.dataset.k;
 if(k==="edit"){if(!busy)startEdit(+b.dataset.i,b.closest(".m"));return}
 if(k==="cancel"){render();return}
 if(k==="zip"){downloadZip(chats.find(x=>x.id===cur),+b.dataset.i);return}
 if(k==="send"){sendEdit(+b.dataset.i,b.closest(".m"));return}
 const text=b.dataset.k==="code"?b.closest(".cb").querySelector("code").textContent.replace(/\n$/,""):(chats.find(x=>x.id===cur)?.msgs[b.dataset.i]?.content||"");
 const ok=await copyText(text),old=b.textContent;
 b.textContent=ok?"Copied ✓":"Copy failed";setTimeout(()=>{b.textContent=old},1500);
});
const t=$("#t");t.oninput=()=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"};
t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();$("#f").requestSubmit()}};
function startEdit(i,d){
 const m=(chats.find(x=>x.id===cur)||{msgs:[]}).msgs[i];if(!m)return;
 d.classList.add("editing");
 d.innerHTML=attHtml(m)+`<textarea class="ed"></textarea><div class="mact"><button type="button" class="cp" data-k="send" data-i="${i}">Send</button><button type="button" class="cp" data-k="cancel">Cancel</button></div>`;
 const ta=d.querySelector("textarea");ta.value=m.content;
 ta.onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendEdit(i,d)}};
 ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
function sendEdit(i,d){
 const c=chats.find(x=>x.id===cur),m=c&&c.msgs[i],v=d.querySelector("textarea").value.trim();
 if(!m||busy||(!v&&!(m.att||[]).length))return;
 m.content=v;c.msgs=c.msgs.slice(0,i+1);c.model=$("#model").value;
 if(i===0)c.title=(v||m.att[0].name).slice(0,40);
 generate(c);
}
$("#f").onsubmit=async e=>{
 e.preventDefault();
 if(busy){busy.abort();return}
 const text=t.value.trim();if(!text&&!pending.length)return;
 t.value="";t.style.height="auto";
 let c=chats.find(x=>x.id===cur);
 if(!c){c={id:Date.now()+"",title:(text||pending[0].name).slice(0,40),msgs:[],model:$("#model").value};chats.unshift(c);cur=c.id}
 c.model=$("#model").value;
 c.msgs.push({role:"user",content:text,att:pending});pending=[];renderTray();
 generate(c);
};
function partLimit(id){const ctx=models.find(x=>x.id===id)?.ctx||32768;return Math.min(120000,Math.max(24000,ctx*2))}
async function streamModel(model,msgs,signal,onText,onCut){
 const r=await fetch("/api/chat",{method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({model,stream:true,messages:msgs})});
 if(r.status===401){showLogin();throw new Error("Session expired. Unlock and try again.")}
 if(!r.ok)throw new Error((await r.text()).slice(0,300)||"Error "+r.status);
 const rd=r.body.getReader(),dec=new TextDecoder();let buf="",got=false;
 for(;;){
  const{done,value}=await rd.read();if(done)break;
  buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
  for(const l of lines){
   if(!l.startsWith("data: ")||l.includes("[DONE]"))continue;
   let j;try{j=JSON.parse(l.slice(6))}catch{continue}
   if(j.error)throw new Error(j.error.message||"Model error");
   if(j.choices?.[0]?.finish_reason==="length")onCut();
   const d=j.choices?.[0]?.delta?.content||"";if(d){got=true;onText(d)}
  }
 }
 if(!got)throw new Error("The model returned nothing. Free models are sometimes busy; try another.");
}
async function generate(c){
 const last=c.msgs[c.msgs.length-1];
 const reply={role:"assistant",content:""};c.msgs.push(reply);render();
 const bub=$("#msgs").lastChild;
 busy=new AbortController();$("#send").textContent="■";
 const vis=!!models.find(x=>x.id===c.model)?.vision;
 try{
  if(!vis){
   for(const m of c.msgs)for(const a of m.att||[])if(a.type==="image"&&a.data&&!a.desc){
    bub.textContent="Reading "+a.name+"…";
    a.desc=await describe(a,m===last?last.content:"",busy.signal);save();
   }
   bub.textContent="";
  }
  const hasProj=c.msgs.some(m=>(m.att||[]).some(a=>a.type==="project"));
  const state=projectFiles(c,c.msgs.length-2),total=state.reduce((n,f)=>n+f.content.length,0),limit=partLimit(c.model);
  let reqs;
  if(hasProj&&total>limit){
   const parts=buildParts(state,limit);
   const tree=state.slice(0,400).map(f=>`${f.path} (${f.content.split("\n").length} lines)`).join("\n");
   const req=toApi(last,false,true).content;
   reqs=parts.map((p,k)=>({msgs:[{role:"user",content:`${SYS_PART}\n\nAll project files:\n${tree}\n\nThe user's request:\n${req}\n\n---\nThis is part ${k+1} of ${parts.length}. Files in this part:\n\n${partText(p)}`}]}));
   reply.content=`*Large project (${state.length} files): processing in ${parts.length} parts.*\n\n`;
  }else{
   const msgs=c.msgs.slice(0,-1).map(m=>toApi(m,vis));
   if(pm||hasProj){const m=msgs.find(x=>x.role==="user");if(m){if(typeof m.content==="string")m.content=SYS+"\n\n---\n\n"+m.content;else m.content[0].text=SYS+"\n\n---\n\n"+m.content[0].text}}
   reqs=[{msgs}];
  }
  let fails=0;
  for(let k=0;k<reqs.length;k++){
   if(k)await new Promise(r=>setTimeout(r,1500));
   if(reqs.length>1)reply.content+=`**— Part ${k+1} of ${reqs.length} —**\n\n`;
   try{
    await streamModel(c.model,reqs[k].msgs,busy.signal,d=>{reply.content+=d;bub.innerHTML=md(reply.content);$("#msgs").scrollTop=$("#msgs").scrollHeight},()=>{reply.cut=true});
   }catch(x){
    if(x.name==="AbortError"||reqs.length===1)throw x;
    fails++;reply.content+=`⚠ Part ${k+1} failed: ${x.message}\n\n`;
   }
   if(reqs.length>1)reply.content+="\n\n";
  }
  if(fails&&fails===reqs.length)reply.err=true;
 }catch(x){if(x.name!=="AbortError"){reply.err=true;reply.content=(reply.content?reply.content+"\n\n":"")+"Error: "+x.message}}
 busy=null;$("#send").textContent="↑";save();render();
}
fetch("/api/status").then(r=>r.json()).then(s=>{s.authed?loadModels():showLogin()});setPM();render();
